<!DOCTYPE html>
<html lang="ru">
<head>
  <!-- Подставляется флагом --base-href при сборке (на GitHub Pages — путь репозитория). -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="description" content="Суфлёр для съёмки с Bluetooth-пультом.">

  <!-- iPhone: запуск с экрана «Домой» без панели Safari -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Суфлёр">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#F4F8F9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0A1822" media="(prefers-color-scheme: dark)">

  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>onAI Суфлёр</title>

  <style>
    :root { color-scheme: light dark; --bg: #F4F8F9; --fg: #0A1822; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0A1822; --fg: #D6E4E8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #loader {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 16px;
      color: var(--fg); font: 500 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #loader img { width: 96px; height: 96px; image-rendering: pixelated; border-radius: 22px; }
  </style>
</head>
<body>
  <div id="loader">
    <img src="icons/Icon-192.png" alt="">
    <div>Загружаю суфлёр…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loader = document.getElementById('loader');
      if (loader) loader.remove();
    });
    // Сначала офлайн-кэш (sw.js), потом приложение: так уже первый запуск
    // целиком ляжет в кэш. Не дождались за 3 секунды — запускаем без кэша.
    (async function () {
      if ('serviceWorker' in navigator) {
        try {
          await navigator.serviceWorker.register('sw.js');
          if (!navigator.serviceWorker.controller) {
            await Promise.race([
              new Promise(function (done) {
                navigator.serviceWorker.addEventListener('controllerchange', done, { once: true });
              }),
              new Promise(function (done) { setTimeout(done, 3000); }),
            ]);
          }
        } catch (e) {}
      }
      var app = document.createElement('script');
      app.src = 'flutter_bootstrap.js';
      document.body.appendChild(app);
    })();
  </script>
</body>
</html>
